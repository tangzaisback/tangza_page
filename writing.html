---
layout: default
title: "글(씨)쓰기"
---

<div class="writing-list-container">
  {% for post in site.posts %}
    <a href="{{ post.url | relative_url }}" class="post-item">
      <div class="post-info">
        <h2 class="post-title">{{ post.title }}</h2>
        <span class="post-date">{{ post.date | date: "%Y. %m. %d" }}</span>
      </div>
      <p class="post-summary">{{ post.excerpt | strip_html | truncate: 120 }}</p>
    </a>
  {% endfor %}
</div>
